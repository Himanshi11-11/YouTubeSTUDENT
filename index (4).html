<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Student – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0f0f0f;--mut:#606060;--card:#f2f2f2;--acc:#ff0000;--line:#e5e5e5;--hd:system-ui,sans-serif}
body.student{--bg:#16342e;--fg:#f1ece0;--mut:#a9bfb4;--card:#1f443c;--acc:#9fd3b4;--line:#2f5a50;--hd:'Fraunces',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--card);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:#fff}
body.student button.pri{color:#10261f;font-weight:600}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:700;font-size:19px;font-family:var(--hd);margin-right:auto}
.logo i{background:var(--acc);color:#fff;border-radius:6px;padding:1px 7px;font-style:normal;margin-right:4px}
body.student .logo i{color:#10261f}
.portal{display:flex;background:var(--card);border-radius:20px;padding:3px}
.portal button{background:none;border-radius:16px;padding:5px 12px}
.portal button.on{background:var(--acc);color:#fff}
body.student .portal button.on{color:#10261f;font-weight:600}
.search{flex:1;min-width:160px;max-width:420px;display:flex}
.search input{flex:1;padding:8px 14px;border:1px solid var(--line);border-radius:20px 0 0 20px;background:var(--bg);color:var(--fg)}
.search button{border-radius:0 20px 20px 0}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:var(--hd);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.thumb{aspect-ratio:16/9;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:17px;position:relative;cursor:pointer}
.thumb small{position:absolute;right:8px;bottom:8px;background:#000b;padding:1px 6px;border-radius:4px;font-size:12px;font-weight:400}
.vid{cursor:pointer}.vid p{margin:6px 0 0;font-weight:600}.vid span{color:var(--mut);font-size:13px}
.banner{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{flex:1;min-width:220px}
.row{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;align-items:center;background:var(--card)}
.row .rk{font:700 26px var(--hd);width:34px;color:var(--acc)}
.row .th{width:120px;aspect-ratio:16/9;border-radius:8px;flex:none}
.row .in{flex:1}.row .in span{color:var(--mut);font-size:13px;display:block}
.score{font:700 20px var(--hd);text-align:right}.score span{font:400 12px system-ui;color:var(--mut)}
.row.hl{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.formula{background:#0003;border-radius:8px;padding:10px 12px;font:13px ui-monospace,monospace;margin:10px 0 16px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:800px){.two{grid-template-columns:1fr}.row .th{width:80px}}
.slide{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;min-height:260px}
.slide h2{font-size:26px}.slide p{font-size:19px;line-height:1.6;margin:8px 0}
.slide .f{font:22px ui-monospace,monospace;color:var(--acc);margin:14px 0}
.dots{display:flex;gap:6px;margin:12px 0}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--acc)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.meter{background:var(--card);border-radius:14px;padding:16px}
.bar{height:12px;background:#0003;border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar div{height:100%;transition:width .4s}
.b1{background:#e0574a}.b2{background:var(--acc)}
.big{font:700 28px var(--hd)}
.q{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.q label{display:block;padding:6px 8px;border-radius:6px;cursor:pointer}
.q label:hover{background:#0002}
.stars button{font-size:24px;padding:4px 10px;background:none;color:var(--mut)}.stars button.on{color:#f5b301}
.watch{aspect-ratio:16/9;background:#000;border-radius:12px;display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.toast{background:var(--acc);color:#10261f;padding:10px 14px;border-radius:10px;margin:12px 0;font-weight:600}
.note{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border-radius:20px;padding:6px 14px;border:1px solid var(--line)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
body.student .chip.on{color:#10261f;font-weight:600}
.badge{display:inline-block;font-size:12px;font-style:normal;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:0 8px;margin-right:6px}
.badge.ok{background:var(--acc);color:#10261f}
.user{display:flex;gap:8px;align-items:center;font-size:13px}
.login{max-width:420px;margin:30px auto;background:var(--card);border-radius:14px;padding:22px}
.login label{display:block;font-size:13px;color:var(--mut)}
.login input{width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.dim{opacity:.45}
.meter ul{margin:6px 0 12px;padding-left:20px}.meter li{margin-bottom:4px}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin-bottom:8px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.thumb,.th,.watch{background-size:cover}
.vid{transition:transform .2s}.vid:hover{transform:translateY(-4px)}.vid .thumb{overflow:hidden;transition:box-shadow .2s,filter .2s}.vid:hover .thumb{box-shadow:0 10px 24px #0004;filter:brightness(1.08)}
.vid .thumb::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:0;background:#0003;border-radius:12px;transition:opacity .2s}.vid:hover .thumb::after{opacity:1}
button.tg.on{background:var(--acc);color:#fff}
.sw{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--mut)}.sw input{position:absolute;opacity:0}.sw i{width:38px;height:22px;border-radius:12px;background:#0004;border:1px solid var(--line);position:relative;transition:.2s}.sw i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{left:18px;background:#10261f}.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
body.student{background:radial-gradient(circle at 8% -10%,#2f7a66 0,transparent 45%),radial-gradient(circle at 100% 0,#3b4a8c66 0,transparent 40%),#16342e;background-attachment:fixed}
body.student header{background:#16342ecc;backdrop-filter:blur(10px)}
body.student .row,body.student .meter,body.student .q{transition:transform .2s,box-shadow .2s,border-color .2s}
body.student .row:hover{transform:translateY(-3px);box-shadow:0 8px 22px #0005;border-color:var(--acc)}
body.student button{transition:transform .15s,background .2s}body.student button:hover{transform:translateY(-1px)}body.student button:active{transform:scale(.95)}
body.student .slide{background:linear-gradient(135deg,#1f443c,#2a6254);box-shadow:0 10px 30px #0004}.slide>*{animation:pop .35s}
body.student .toast{animation:pop .3s}
.hero{font-size:32px;background:linear-gradient(90deg,#9fd3b4,#f5d76e);-webkit-background-clip:text;background-clip:text;color:transparent}
.tc{border-radius:16px;padding:18px;color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:130px}.tc:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 12px 26px #0006}.tc .e{font-size:44px;display:block;transition:transform .3s}.tc:hover .e{transform:scale(1.25) rotate(8deg)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <form class="search" id="sform"><input id="q" placeholder="Search" aria-label="Search"><button type="submit">Search</button></form>
  <div class="portal" role="group" aria-label="Switch portal">
    <button id="pYT">YouTube</button><button id="pST">YouTube Student</button>
  </div>
  <div class="user" id="user"></div>
</header>
<div id="ob"></div><div id="bk" style="max-width:1100px;margin:8px auto 0;padding:0 16px"></div>
<main id="app"></main>

<script>
/* ---------- DATA (hardcoded for demo) ---------- */
const mk=(n,avg,w)=>({n,sumW:n*w,sumRW:n*w*avg});
const LV={boards:'Boards (Class 11–12)',jee:'IIT-JEE level',olympiad:'Olympiad level'};
const STUDENTS={STU1001:{name:'Aarav',cls:'Class 12',goal:'jee'},STU1002:{name:'Diya',cls:'Class 11',goal:'boards'},STU1003:{name:'Kabir',cls:'Class 12',goal:'olympiad'},'vips@himanshi':{name:'Himanshi',cls:'VIPS Student',goal:'boards'},'vips@chayan':{name:'Chayan',cls:'VIPS Student',goal:'boards'}};
const COLORS=['#c0392b','#2d6a4f','#274c77','#7b2cbf','#b5651d','#00796b'];
const videos=[
 {id:1,title:'Bayes Theorem in 10 minutes',teacher:'Ravi Sir',views:2400000,videoMB:95,notesMB:4,topic:'bayes',lvl:'boards',rev:mk(900,3.6,1.2)},
 {id:2,title:'Bayes Theorem: notes + audio walkthrough',teacher:'Meera Ma\'am',views:18000,videoMB:85,notesMB:3.5,topic:'bayes',lvl:'boards',rev:mk(240,4.8,2.6)},
 {id:3,title:'Bayes Theorem – full lecture',teacher:'Prof. Anand',views:640000,videoMB:210,notesMB:5,topic:'bayes',lvl:'jee',rev:mk(500,4.1,1.8)},
 {id:4,title:'Bayes tricks for JEE (fast)',teacher:'Karan Academy',views:1100000,videoMB:70,notesMB:3,topic:'bayes',lvl:'jee',rev:mk(700,3.1,1.0)},
 {id:5,title:'Bayes Theorem, step by step',teacher:'Sana Verma',views:9000,videoMB:60,notesMB:3,topic:'bayes',lvl:'boards',rev:mk(120,4.5,2.2)},
 {id:6,title:'Bayes in olympiad problems',teacher:'Dr. Iyer',views:4000,videoMB:75,notesMB:3.5,topic:'bayes',lvl:'olympiad',rev:mk(60,4.7,2.4)},
 {id:7,title:'Conditional probability traps',teacher:'Nikhil Rao',views:7000,videoMB:90,notesMB:4,topic:'bayes',lvl:'olympiad',rev:mk(80,4.2,2.0)}
];
[
['newton',"Newton's laws in 12 minutes",'Ravi Sir',3100000,110,4,'boards',1200,3.5,1.1],
['newton',"Newton's laws: notes + audio",'Meera Ma\'am',22000,80,3.5,'boards',260,4.7,2.5],
['newton','Free body diagrams for JEE','Prof. Anand',520000,190,5,'jee',420,4.2,1.9],
['newton','Pulley and friction tricks','Karan Academy',900000,65,3,'jee',650,3.0,1.0],
['newton','Non-inertial frames explained','Dr. Iyer',5000,80,3.5,'olympiad',55,4.6,2.3],
['photo','Photosynthesis full chapter','Ravi Sir',2700000,120,4,'boards',1000,3.4,1.2],
['photo','Photosynthesis: notes + audio','Sana Verma',14000,60,3,'boards',180,4.8,2.4],
['photo','Calvin cycle and C4 for NEET/JEE','Prof. Anand',480000,150,4.5,'jee',350,4.1,1.8],
['photo','Z-scheme and photorespiration','Dr. Iyer',3500,75,3.5,'olympiad',48,4.6,2.2],
['deriv','Derivatives from scratch','Karan Academy',1900000,100,4,'boards',800,3.3,1.0],
['deriv','Derivatives: notes + audio','Meera Ma\'am',16000,70,3,'boards',210,4.7,2.5],
['deriv','Maxima and minima for JEE','Prof. Anand',610000,180,5,'jee',390,4.2,1.9],
['deriv','Mean value theorem and inequalities','Nikhil Rao',4500,85,4,'olympiad',52,4.5,2.1]
].forEach(a=>videos.push({id:videos.length+1,topic:a[0],title:a[1],teacher:a[2],views:a[3],videoMB:a[4],notesMB:a[5],lvl:a[6],rev:mk(a[7],a[8],a[9])}));
const SL_bayes=[
 {h:'The 11 PM problem',p:'Exam is tomorrow and you are not sure what Bayes theorem is for. Let us fix that in five short slides.'},
 {h:'What it answers',p:'When you see new evidence, how should you update what you believed before?'},
 {h:'The formula',p:'The probability of A given B equals the probability of B given A, times the probability of A, divided by the probability of B.',f:'P(A|B) = P(B|A) · P(A) / P(B)'},
 {h:'Prior and posterior',p:'P(A) is the prior, what you believed before. P(A|B) is the posterior, what you believe after seeing B.'},
 {h:'Quick example',p:'A test catches a disease 90 percent of the time, but only 1 percent of people have it. A positive result is still not certain. Bayes shows exactly how likely it is.'}
];
const QZ_bayes=[
 {q:'P(A|B) equals…',o:['P(B|A)·P(A) / P(B)','P(A)·P(B)','P(B|A) + P(A)'],a:0},
 {q:'In P(A|B), the "prior" is…',o:['P(B)','P(A)','P(A|B)'],a:1},
 {q:'Bayes theorem is used to…',o:['Add two probabilities','Find the mean of data','Update a belief after new evidence'],a:2}
];

/* ---------- STATE ---------- */
let mode='yt',view='home',cur=null,slide=0,playing=false,tok=0,prog=0,lastRank=null,result=null,user=null,lvl='all',reviewed=new Set(),afterLogin=null,offline=false;
let store={items:[],queue:[]};let yc='all',ex={lk:[],sb:[]},lt='in';try{Object.assign(STUDENTS,JSON.parse(localStorage.getItem('ysa')||'{}'));const e=JSON.parse(localStorage.getItem('ysx')||'null');if(e)ex=e}catch(e){}
let nl='en',al='en',pl={},vq='720p',dq='360p',aq='Standard',ys='rev',cmts={},tp=null,hist=[],ov=false,hs={};try{const l=localStorage.getItem('ysl');if(l){nl=l.slice(0,2);al=l.slice(2)}cmts=JSON.parse(localStorage.getItem('ysc')||'{}')}catch(e){}try{hs=JSON.parse(localStorage.getItem('ysq')||'{}')}catch(e){}
try{const t=JSON.parse(localStorage.getItem('ys')||'null');if(t)store.items=t.items||[]}catch(e){}
const persist=()=>{try{localStorage.setItem('ys',JSON.stringify({items:store.items}))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const score=v=>v.rev.sumRW/v.rev.sumW;
const fmtV=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n;
const ranked=()=>[...videos].sort((a,b)=>score(b)-score(a)||b.rev.n-a.rev.n);
const col=v=>COLORS[v.id%COLORS.length];

/* ---------- SHELL ---------- */
function shell(){
  document.body.classList.toggle('student',mode==='st');
  $('#logo').innerHTML=mode==='st'?'<i>▶</i>YouTube Student':'<i>▶</i>YouTube';
  $('#pYT').classList.toggle('on',mode==='yt');$('#pST').classList.toggle('on',mode==='st');userChip();$('#bk').innerHTML=(hist.length&&(view!=='home'||ov))?'<button onclick="goBack()">← Back</button>':'';
  $('#ob').innerHTML=(mode==='st'&&offline)?'<div class="banner" style="margin:0;border-radius:0"><b>Offline mode. Saved lessons, summaries and quizzes still work. Reviews sync when you reconnect.</b></div>':'';
}
function userChip(){
  const n=store.items.length;
  $('#user').innerHTML=`<button onclick="go(mode,'downloads')">Downloads${n?' ('+n+')':''}</button>`+(mode==='st'?`<label class="sw"><input type="checkbox" ${offline?'checked':''} onchange="setOffline(this.checked)"><i></i>Offline</label>`+(user?`<span class="badge ok">Verified</span><button onclick="go('st','profile')">${user.name} · ${user.cls}</button><button onclick="logout()">Log out</button>`:`<button onclick="askLogin()">Student login</button>`):'');
}
function go(m,v,vid,nb){stop();if(!nb)hist.push({m:mode,v:view,id:cur&&cur.id,t:tp});ov=false;if(m==='yt')offline=false;mode=m;view=v;if(vid){cur=videos.find(x=>x.id===vid);tp=cur.topic;useTopic()}shell();render();scrollTo(0,0)}
function goBack(){const h=hist.pop();if(!h)return go(mode,'home',0,1);tp=h.t;go(h.m,h.v,h.id,1)}
function openTopic(k){tp=k;lvl=user?user.goal:'all';go('st','list')}
$('#pYT').onclick=()=>go('yt','home');
$('#pST').onclick=()=>go('st','home');
$('#sform').onsubmit=e=>{e.preventDefault();$('#q').dataset.s=$('#q').value;go(mode,'home')};
$('#logo').onclick=()=>go(mode,'home');

/* ---------- YOUTUBE CLONE ---------- */
function ytHome(){
  const q=($('#q').value||'').toLowerCase(),sj=t=>T[t].sub.split(' · ')[0],cats=['all',...new Set(Object.keys(T).map(sj))];
  const list=videos.filter(v=>(yc==='all'||sj(v.topic)===yc)&&(v.title+v.teacher).toLowerCase().includes(q)).sort((a,b)=>ys==='rev'?score(b)-score(a)||b.rev.n-a.rev.n:b.views-a.views);
  app.innerHTML=`<div class="banner"><b>Short on data tonight? Try notes + audio with reviews from students who passed the quiz.</b><button class="pri" onclick="go('st','home')">Open YouTube Student</button></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${yc===c?'on':''}" onclick="yc='${c}';ytHome()">${c==='all'?'All':c}</button>`).join('')}<span style="flex:1"></span><button class="chip ${ys==='rev'?'on':''}" onclick="ys='rev';ytHome()">⭐ Best student reviews</button><button class="chip ${ys==='views'?'on':''}" onclick="ys='views';ytHome()">🔥 Most viewed</button></div>
  <div class="grid">${list.map(v=>`<div class="vid" onclick="go('yt','watch',${v.id})"><div class="thumb" style="${bg(v)}">${v.title}<small>${v.videoMB>100?'38:12':'10:24'}</small></div><p>${v.title}</p><span>${v.teacher}${ex.sb.includes(v.teacher)?' ✓':''} · ${fmtV(v.views)} views · ★ ${score(v).toFixed(1)} (${v.rev.n})</span></div>`).join('')||'<p>No results. Try another search or category.</p>'}</div>
  <p class="note">${ys==='rev'?'Sorted by weighted student reviews, so a clear lesson with fewer views can rank first.':'Sorted by views only. Most-watched is on top, whether or not it helped.'}</p>`;
}
function tgl(k,id){const v=videos.find(x=>x.id===id),x=k==='sb'?v.teacher:id,a=ex[k],i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);try{localStorage.setItem('ysx',JSON.stringify(ex))}catch(e){}ytWatch()}
function ytWatch(){
  const nx=videos.filter(v=>v.id!==cur.id).sort((a,b)=>(b.topic===cur.topic)-(a.topic===cur.topic)||score(b)-score(a)).slice(0,4);
  app.innerHTML=`<div class="two"><div><div class="watch" style="${bg(cur)}"><div><h2>▶ ${cur.title}</h2><p>Playing at <b>${vq}</b>. Streaming uses about <b>${vmb(cur,vq)} MB</b> of mobile data.</p></div></div>
  <div class="ctrl" style="margin-top:10px"><label class="note">Video quality ${sel('vq',Object.keys(F),vq)}</label></div>
  <h2 style="margin-top:12px">${cur.title}</h2><span class="note">${cur.teacher} · ${fmtV(cur.views)} views · ★ ${score(cur).toFixed(1)} from ${cur.rev.n} students</span><div class="ctrl" style="margin-top:8px"><button class="tg ${ex.lk.includes(cur.id)?'on':''}" onclick="tgl('lk',${cur.id})">👍 ${fmtV(Math.round(cur.views/60)+(ex.lk.includes(cur.id)?1:0))}</button><button class="tg ${ex.sb.includes(cur.teacher)?'on':''}" onclick="tgl('sb',${cur.id})">${ex.sb.includes(cur.teacher)?'🔔 Subscribed':'Subscribe'} · ${cur.teacher}</button></div>
  <div class="ctrl" style="margin:12px 0;align-items:center"><label class="note">Download quality ${sel('dq',Object.keys(F),dq)}</label><button onclick="download(${cur.id},'video')">⬇ Video · ${vmb(cur,dq)} MB</button><label class="note">Audio ${sel('aq',Object.keys(AF),aq)}</label><button onclick="download(${cur.id},'audio')">⬇ Audio · ${amb(cur,aq)} MB</button><button onclick="dlNotes()">⬇ Notes file</button></div><div id="dlstat"></div>
  <div class="banner" style="margin-top:14px"><b>Even audio only is ${amb(cur,aq)} MB. Notes + audio is ${cur.notesMB} MB, with an AI summary and an offline quiz.</b><button class="pri" onclick="tp='${cur.topic}';lvl=user?user.goal:'all';go('st','list')">Switch to YouTube Student</button></div></div>
  <div><h3>Recommended by student reviews</h3>${nx.map(v=>`<div class="vid" style="margin-bottom:12px" onclick="go('yt','watch',${v.id})"><div class="thumb" style="${bg(v)};aspect-ratio:21/9">${v.title}</div><span>${v.teacher} · ★ ${score(v).toFixed(1)} · ${fmtV(v.views)} views</span></div>`).join('')}</div></div>`;
}

/* ---------- STUDENT: HOME + RANKED LIST ---------- */
function stHome(){
  const q=($('#q').value||'').toLowerCase(),ks=Object.keys(T).filter(k=>!q||(T[k].name+T[k].sub+videos.filter(v=>v.topic===k).map(v=>v.title+v.teacher).join()).toLowerCase().includes(q));
  app.innerHTML=`<h1 class="hero">What are you studying tonight?</h1><p class="note">Pick a topic. Results are ranked by how much students learned, not by views. Then choose how deep you need to go: Boards, IIT-JEE or Olympiad.</p>

SIMPLE:'पत्ती एक छोटी सौर रसोई है। धूप बिजली है, पानी और हवा सामग्री हैं, और शर्करा भोजन है। ऑक्सीजन बचा हुआ हिस्सा है जिसमें हम साँस लेते हैं।'};
T.deriv.hi={slides:HS([['परिवर्तन की दर','अभी कोई चीज़ कितनी तेज़ी से बदल रही है? कार का स्पीडोमीटर एक अवकलज दिखाता है।'],['परिभाषा','अवकलज, y में बदलाव और x में बदलाव के अनुपात की सीमा है, जब x का बदलाव शून्य की ओर जाता है।'],['घात नियम','घात को आगे लाइए और घात में एक घटाइए।'],['इसका अर्थ','अवकलज स्पर्श रेखा की ढाल है। धनात्मक का मतलब बढ़ना, ऋणात्मक का मतलब घटना, शून्य का मतलब समतल मोड़ बिंदु।'],['छोटा उदाहरण','f(x) = x³ के लिए f′(x) = 3x²। x = 2 पर ढाल 12 है।']]),
SUM:{boards:['अवकलज = परिवर्तन की दर = स्पर्श रेखा की ढाल।','घात नियम: d/dx xⁿ = n xⁿ⁻¹।','अधिकतम और न्यूनतम बिंदु पाने के लिए f′(x) = 0 रखें।'],jee:['गुणनफल, भागफल और शृंखला नियम याद रखें।','f′ के चिह्न बदलने से अधिकतम और न्यूनतम पहचानें।','x² + y² = 25 जैसे वक्रों के लिए अव्यक्त अवकलन करें।'],olympiad:['माध्यमान प्रमेय: कोई बिंदु ऐसा होता है जहाँ ढाल औसत ढाल के बराबर हो।','फलन कहाँ बढ़ता या घटता है, यह देखकर असमिकाएँ सिद्ध करें।','केवल सांतत्य नहीं, कोनों पर अवकलनीयता भी जाँचें।']},
SIMPLE:'कार की यात्रा बताती है कि आप कितनी दूर गए। स्पीडोमीटर बताता है कि इसी क्षण दूरी कितनी तेज़ी से बदल रही है। यही तात्कालिक परिवर्तन दर अवकलज है।'};

const GR={bayes:['#7b2cbf','#3a0ca3'],newton:['#f77f00','#c1121f'],photo:['#1b4332','#40916c'],deriv:['#0077b6','#023e8a']};
const bg=v=>v.img?`background:url('${v.img}') center/cover`:`background:url('data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><text x="60" y="95" font-size="90" text-anchor="middle" opacity=".35">'+T[v.topic].ic+'</text></svg>')}') right -10px bottom -10px/90px no-repeat,linear-gradient(135deg,${GR[v.topic][0]},${GR[v.topic][1]})`;
const F={'144p':.15,'360p':.35,'480p':.55,'720p':1,'1080p':1.9},AF={'Low':.6,'Standard':1,'High':1.6};
const vmb=(v,q)=>+(v.videoMB*F[q]).toFixed(1),amb=(v,q)=>+(aud(v)*AF[q]).toFixed(1);
const sel=(k,o,v)=>`<select onchange="setQ('${k}',this.value)">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
function setQ(k,v){if(k==='vq')vq=v;else if(k==='dq')dq=v;else aq=v;ytWatch()}
const tf=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function openItem(i){stop();pl={i,t:0,run:false,spd:1};go(mode,'play')}
function plDur(){const v=videos.find(y=>y.id===store.items[pl.i].vid);return v.videoMB>100?2292:624}
function plCtl(a,x){const d=plDur();
 if(a==='pp'){pl.run=!pl.run;clearInterval(pl.iv);if(pl.run)pl.iv=setInterval(()=>{pl.t=Math.min(d,pl.t+pl.spd);if(pl.t>=d)plCtl('stop');else plPaint()},1000)}
 else if(a==='stop'){pl.run=false;clearInterval(pl.iv);pl.t=0}
 else if(a==='skip')pl.t=Math.max(0,Math.min(d,pl.t+x));
 else if(a==='seek')pl.t=+x;
 else if(a==='spd')pl.spd=x;
 plPaint()}
function plPaint(){const sk=$('#sk');if(!sk)return;const d=plDur();sk.max=d;sk.value=pl.t;$('#tm').textContent=tf(pl.t)+' / '+tf(d);$('#ppb').textContent=pl.run?'⏸ Pause':'▶ Play';$('#pst').textContent=pl.run?'▶ Playing':'⏸ Paused';document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',+b.dataset.r===pl.spd))}
function playView(){const x=store.items[pl.i];if(!x)return dlView();const v=videos.find(y=>y.id===x.vid);
 app.innerHTML=`<h2>${v.title}</h2><span class="note">${v.teacher} · ${LABEL[x.type]}${x.q?' · '+x.q:''} · playing from this device, no data used</span>
 <div class="watch" style="${bg(v)};margin-top:12px"><div id="pst" style="font-size:36px;font-weight:700"></div></div>
 <input type="range" id="sk" min="0" value="0" style="width:100%;margin-top:10px" aria-label="Seek" oninput="plCtl('seek',this.value)"><div class="note" id="tm"></div>
 <div class="ctrl" style="margin:10px 0"><button onclick="plCtl('skip',-10)">⏪ 10s</button><button class="pri" id="ppb" onclick="plCtl('pp')"></button><button onclick="plCtl('skip',10)">10s ⏩</button><button onclick="plCtl('stop')">⏹ Stop</button></div>
 <div class="ctrl"><span class="note">Speed</span>${[.75,1,1.25,1.5,2].map(r=>`<button class="chip" data-r="${r}" onclick="plCtl('spd',${r})">${r}×</button>`).join('')}</div>`;plPaint()}

/* ---------- ROUTER ---------- */
function render(){
  if(view==='play')return playView();if(view==='profile'&&user)return profView();if(view==='downloads')return dlView();
  if(mode==='yt') view==='watch'?ytWatch():ytHome();
  else view==='learn'?stLearn():view==='list'?stList():stHome();
}
shell();render();
$('#q').oninput=()=>{if(view==='home')render()};
</script>
